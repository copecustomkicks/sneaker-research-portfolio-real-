<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Engineering a Sneaker from Materials Research to Functional Prototype. Research portfolio by Aidan Copeland, University of Florida.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DEDACF" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C4BFB2" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F7F6F3"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0021A5"/>

  <!-- Eyebrow -->
  <text x="80" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#565C66">
    UNIVERSITY SCHOLARS PROGRAM · UNIVERSITY OF FLORIDA
  </text>

  <!-- Title -->
  <text x="80" y="212" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#14181D">
    Engineering a Sneaker
  </text>
  <text x="80" y="284" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#14181D">
    from Materials Research
  </text>
  <text x="80" y="356" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#14181D">
    to Functional Prototype
  </text>

  <line x1="80" y1="418" x2="700" y2="418" stroke="#C4BFB2" stroke-width="2"/>

  <text x="80" y="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#14181D">
    Aidan Copeland
  </text>
  <text x="80" y="512" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#565C66">
    Mechanical Engineering · Active research record
  </text>

  <!-- Layer stack, right side -->
  <g stroke-linejoin="round">
    <path d="M760 214 C 766 184, 790 168, 818 168 L 880 168 C 918 168, 948 184, 980 202 L 1028 202 C 1054 202, 1070 210, 1070 214 Z"
          fill="#FFFFFF" stroke="#14181D" stroke-width="3"/>
    <path d="M786 182 L 828 196 M 790 196 L 832 210" stroke="#0021A5" stroke-width="4" stroke-linecap="round"/>

    <rect x="762" y="250" width="308" height="26" fill="url(#hatch)" stroke="#14181D" stroke-width="3"/>
    <rect x="760" y="304" width="312" height="26" fill="#EFEDE7" stroke="#14181D" stroke-width="3"/>

    <path d="M756 358 C 756 358, 830 352, 916 352 C 1002 352, 1076 358, 1076 358 L 1076 424 C 1076 424, 1002 418, 916 418 C 830 418, 756 424, 756 424 Z"
          fill="#E4E0D6" stroke="#14181D" stroke-width="3"/>
    <g fill="#C4BFB2">
      <circle cx="800" cy="380" r="4"/><circle cx="836" cy="392" r="4"/><circle cx="872" cy="378" r="4"/>
      <circle cx="908" cy="392" r="4"/><circle cx="944" cy="378" r="4"/><circle cx="980" cy="392" r="4"/>
      <circle cx="1016" cy="380" r="4"/>
    </g>

    <path d="M754 452 C 754 448, 830 444, 916 444 C 1002 444, 1078 448, 1078 452 L 1078 486 C 1078 490, 1002 494, 916 494 C 830 494, 754 490, 754 486 Z"
          fill="#2C2E33" stroke="#14181D" stroke-width="3"/>
    <g stroke="#F7F6F3" stroke-width="4" stroke-linecap="round">
      <line x1="790" y1="458" x2="790" y2="480"/><line x1="830" y1="458" x2="830" y2="480"/>
      <line x1="870" y1="458" x2="870" y2="480"/><line x1="910" y1="458" x2="910" y2="480"/>
      <line x1="950" y1="458" x2="950" y2="480"/><line x1="990" y1="458" x2="990" y2="480"/>
      <line x1="1030" y1="458" x2="1030" y2="480"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0021A5" font-weight="600">
    <text x="1092" y="200">01</text>
    <text x="1092" y="270">02</text>
    <text x="1092" y="324">03</text>
    <text x="1092" y="394">04</text>
    <text x="1092" y="474">05</text>
  </g>
</svg>
